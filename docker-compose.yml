version: "3.9"

services:
  gmaps-scraper:
    build: .
    container_name: gmaps-scraper
    restart: unless-stopped
    environment:
      - TZ=Asia/Karachi
      - QUERY=dentists in Lahore
      - MAX_RESULTS=500
      # Optional: enables Places API fallback / top-up in maps_runner.py
      # - GOOGLE_MAPS_API_KEY=your_key_here
      - ROTATE_EVERY=150
      - OUTFILE=/app/out/businesses.csv
    volumes:
      - ./out:/app/out
    # Batch job only — no published ports
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
